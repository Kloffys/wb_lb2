<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Checkbox та Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>1. Чекбокси з оформленням залежно від стану</h2>

    <div class="checkbox-group">
        <input type="checkbox" id="cb1"><label for="cb1">1</label>
        <input type="checkbox" id="cb2"><label for="cb2">2</label>
        <input type="checkbox" id="cb3"><label for="cb3">3</label>
        <input type="checkbox" id="cb4"><label for="cb4">4</label>
        <input type="checkbox" id="cb5"><label for="cb5">5</label>
        <input type="checkbox" id="cb6"><label for="cb6">6</label>
        <input type="checkbox" id="cb7"><label for="cb7">7</label>
        <input type="checkbox" id="cb8"><label for="cb8">8</label>
    </div>

    <h2>2. Контейнер із елементами Flexbox</h2>

    <div class="flex-container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">7</div>
        <div class="item">8</div>
        <div class="item large">9</div>
    </div>

</body>

</html>
